<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign-up — Crew Guide</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0ede6; color: #3a3a48;
    padding: 32px 20px; line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 40px auto 0; background: #fff;
          border-radius: 18px; padding: 36px 30px; text-align: center;
          box-shadow: 0 8px 40px rgba(0,0,0,.10); }
  @media (prefers-color-scheme: dark) {
    body { background:#15151c; color:#e8e6ef; }
    .wrap { background:#20202a; }
  }
  .plane { font-size: 34px; }
  h1 { font-size: 22px; font-weight: 600; margin: 8px 0 10px; }
  p { font-size: 15px; margin-bottom: 8px; }
  a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="plane">🛫</div>
  <h1 id="titre">Crew Guide</h1>
  <p id="texte"></p>
  <p><a href="/">crewguide.aero</a></p>
</div>
<script>
  var etats = {
    confirmee: ["You're on the list", "Thank you, your sign-up is confirmed. We will let you know as soon as Crew Guide opens."],
    retiree:   ["Address removed", "Your address has been removed from our list. We will not write to you again."],
    inconnu:   ["Link expired", "This link is no longer valid. You can sign up again from the home page."],
    erreur:    ["Something went wrong", "Please try again in a few minutes, or write to contact@crewguide.aero."]
  };
  var e = etats[new URLSearchParams(location.search).get("etat")] || etats.inconnu;
  document.getElementById("titre").textContent = e[0];
  document.getElementById("texte").textContent = e[1];
</script>
</body>
</html>
